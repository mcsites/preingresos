<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión Portátil</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 12px #aaa; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .summary { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Gestión de Pronóstico y Gastos</h1>
        
        <div class="form-group">
            <button id="btnIniciarSesion" onclick="loginWithGoogle()">Iniciar Sesión con Google</button>
        </div>

        <div class="form-group">
            <label for="csvFile">Cargar Archivo CSV Existente:</label>
            <input type="file" id="csvFile" accept=".csv">
            <span id="archivoInfo">Ningún archivo cargado.</span>
        </div>

        <hr>

        <h2>Configuración</h2>
        <div class="form-group">
            <label for="separador">Símbolo Separador:</label>
            <input type="text" id="separador" value=";" style="width: 50px;">
        </div>
        <div class="form-group">
            <label for="ingreso">Ingreso Mensual Supuesto ($):</label>
            <input type="number" id="ingreso" value="100.00" step="0.01">
        </div>

        <hr>

        <h2>Registrar Producto</h2>
        <form id="formRegistro">
            <div class="form-group"><label>Mes/Año:</label><input type="text" id="mesAnio" placeholder="Ej. 10/2026" required></div>
            <div class="form-group"><label>Producto:</label><input type="text" id="producto" required></div>
            <div class="form-group"><label>Inversión/Costo ($):</label><input type="number" id="inversion" step="0.01" required></div>
            <div class="form-group"><label>Categoría:</label><input type="text" id="categoria" required></div>
            <div class="form-group"><label>Tienda:</label><input type="text" id="tienda" required></div>
            <button type="submit">Agregar a la Lista</button>
        </form>

        <hr>

        <h2>Tabla Acumulada</h2>
        <table id="tablaDatos">
            <thead>
                <tr>
                    <th>MES/AÑO</th>
                    <th>PRODUCTO</th>
                    <th>INVERSIÓN</th>
                    <th>CATEGORÍA</th>
                    <th>TIENDA</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="summary" id="resumen"></div>

        <hr>
        <button id="btnGuardar" style="background-color: #28a745;">Descargar CSV Actualizado</button>
    </div>

    <script>
        let registros = [];
        let accessToken;
        const csvFile = document.getElementById('csvFile');
        const archivoInfo = document.getElementById('archivoInfo');
        const formRegistro = document.getElementById('formRegistro');
        const btnGuardar = document.getElementById('btnGuardar');
        const tablaBody = document.querySelector('#tablaDatos tbody');
        const resumen = document.getElementById('resumen');

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: '889002724696-q60utmp5fnf2gedffu12vj9q26p8c9c8.apps.googleusercontent.com',
                callback: handleCredentialResponse
            });
            renderTable();
        };

        function handleCredentialResponse(response) {
            accessToken = response.credential;
            alert('¡Autenticación exitosa!');
        }

        function loginWithGoogle() {
            google.accounts.id.prompt();
        }

        csvFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            archivoInfo.textContent = 'Archivo: ' + file.name;
            const text = await file.text();
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const sep = document.getElementById('separador').value;
            registros = [];
            
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(sep);
                if (cols.length === 5) {
                    registros.push({
                        mesAnio: cols[0],
                        producto: cols[1],
                        inversion: parseFloat(cols[2].replace(',', '.')),
                        categoria: cols[3],
                        tienda: cols[4]
                    });
                }
            }
            renderTable();
        });

        formRegistro.addEventListener('submit', (e) => {
            e.preventDefault();
            registros.push({
                mesAnio: document.getElementById('mesAnio').value,
                producto: document.getElementById('producto').value,
                inversion: parseFloat(document.getElementById('inversion').value),
                categoria: document.getElementById('categoria').value,
                tienda: document.getElementById('tienda').value
            });
            formRegistro.reset();
            renderTable();
            alert('Producto agregado a memoria.');
        });

        btnGuardar.addEventListener('click', () => {
            const sep = document.getElementById('separador').value;
            let csvContent = 'MES/AÑO' + sep + 'PRODUCTO' + sep + 'INVERSIÓN' + sep + 'CATEGORÍA' + sep + 'TIENDA\n';
            
            registros.forEach(r => {
                csvContent += `${r.mesAnio}${sep}${r.producto}${sep}${r.inversion.toFixed(2)}${sep}${r.categoria}${sep}${r.tienda}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "ingresos_pronostico.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            alert('¡Descarga iniciada!');
        });

        function renderTable() {
            tablaBody.innerHTML = '';
            let totalGastos = 0;
            registros.forEach(r => {
                const row = `<tr>
                    <td>${r.mesAnio}</td>
                    <td>${r.producto}</td>
                    <td>${r.inversion.toFixed(2)}</td>
                    <td>${r.categoria}</td>
                    <td>${r.tienda}</td>
                </tr>`;
                tablaBody.innerHTML += row;
                totalGastos += r.inversion;
            });

            const ingreso = parseFloat(document.getElementById('ingreso').value);
            const balance = ingreso - totalGastos;
            resumen.innerHTML = `
                <p>Ingreso Supuesto Mensual: $${ingreso.toFixed(2)}</p>
                <p>Total Gastos/Inversión:   $${totalGastos.toFixed(2)}</p>
                <p><strong>Balance Restante:         $${balance.toFixed(2)}</strong></p>
            `;
        }
    </script>
</body>
</html>
