<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de CSV en Google Drive</title>
    <style>
        body { background-color: #0d0f18; color: #f0f0f0; font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #ff007f; }
        input, button { background: #0d0f18; color: #fff; border: 1px solid #ff007f; padding: 10px; margin: 5px 0; width: 100%; border-radius: 4px; }
        button { background: #ff007f; cursor: pointer; font-weight: bold; }
        button:hover { background: #e0006e; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        th { background: #21262d; color: #ff007f; }
        .summary { margin-top: 15px; background: #21262d; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistema de Pronóstico Acumulativo</h2>
    
    <div id="auth-section">
        <button id="authorize_button" onclick="handleAuthClick()">Conectar con Google Drive</button>
    </div>

    <div id="app-section" style="display:none;">
        <p>Sesión iniciada correctamente.</p>
        
        <h3>Configuración Inicial</h3>
        <label>Supuesto de Ingreso Mensual:</label>
        <input type="number" id="ingresoMensual" value="100.00" step="0.01">

        <h3>Agregar Nuevo Producto</h3>
        <input type="text" id="mesAnio" placeholder="Mes y Año (Ej. 10/2026)">
        <input type="text" id="producto" placeholder="Nombre del Producto">
        <input type="number" id="inversion" placeholder="Inversión / Costo" step="0.01">
        <input type="text" id="categoria" placeholder="Categoría">
        <input type="text" id="tienda" placeholder="Tienda">
        <button onclick="agregarYGuardar()">Guardar en Google Drive</button>
        
        <p id="status-message" style="color: #ff007f;"></p>

        <h3>3. Contenido Actual del CSV</h3>
        <table id="csv-table">
            <thead>
                <tr>
                    <th>MES/AÑO</th>
                    <th>PRODUCTO</th>
                    <th>INVERSIÓN</th>
                    <th>CATEGORÍA</th>
                    <th>TIENDA</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="summary" id="balance-summary">
            <!-- Aquí se mostrarán los totales y balances -->
        </div>
    </div>
</div>

<!-- Scripts de Google GSI y API -->
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>

<script>
    const CLIENT_ID = 'TU_CLIENT_ID.apps.googleusercontent.com'; // Reemplaza con tu Client ID
    const API_KEY = '889002724696-q60utmp5fnf2gedffu12vj9q26p8c9c8.apps.googleusercontent.com'; // Reemplaza con tu API Key
    // Se amplía el scope para tener permisos completos de edición de archivos en Drive
    const SCOPES = 'https://www.googleapis.com/auth/drive';
    const FILE_NAME = 'ingresos_pronostico.csv';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;
    let fileId = null;
    let csvRows = [];

    function gapiLoaded() {
        gapi.load('client', initializeGapiClient);
    }

    async function initializeGapiClient() {
        await gapi.client.init({
            apiKey: API_KEY,
            discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
        });
        gapiInited = true;
        maybeEnableButtons();
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: '', // Definido al solicitar
        });
        gisInited = true;
        maybeEnableButtons();
    }

    function maybeEnableButtons() {
        if (gapiInited && gisInited) {
            document.getElementById('authorize_button').style.display = 'block';
        }
    }

    function handleAuthClick() {
        tokenClient.callback = async (resp) => {
            if (resp.error !== undefined) {
                throw (resp);
            }
            document.getElementById('authorize_button').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            await buscarOCrearArchivo();
        };

        if (gapi.client.getToken() === null) {
            tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
            tokenClient.requestAccessToken({prompt: ''});
        }
    }

    async function buscarOCrearArchivo() {
        try {
            let response = await gapi.client.drive.files.list({
                q: `name='${FILE_NAME}' and trashed=false`,
                fields: 'files(id, name)',
            });
            let files = response.result.files;
            if (files.length > 0) {
                fileId = files[0].id;
                await leerArchivoCSV();
            } else {
                await crearArchivoCSV();
            }
        } catch (err) {
            document.getElementById('status-message').innerText = 'Error al buscar el archivo: ' + err.message;
        }
    }

    async function crearArchivoCSV() {
        const cabecera = "MES/AÑO;PRODUCTO;INVERSION;CATEGORIA;TIENDA\n";
        const blob = new Blob([cabecera], {type: 'text/plain'});
        const metadata = {
            name: FILE_NAME,
            mimeType: 'text/csv',
        };

        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
        form.append('file', blob);

        let response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: new Headers({'Authorization': 'Bearer ' + gapi.client.getToken().access_token}),
            body: form
        });
        let result = await response.json();
        fileId = result.id;
        csvRows = [];
        actualizarTablaUI();
    }

    async function leerArchivoCSV() {
        try {
            let response = await gapi.client.drive.files.get({
                fileId: fileId,
                alt: 'media',
            });
            let contenido = response.body;
            procesarContenidoCSV(contenido);
        } catch (err) {
            document.getElementById('status-message').innerText = 'Error al leer el archivo.';
        }
    }

    function procesarContenidoCSV(texto) {
        let lineas = texto.split('\n');
        csvRows = [];
        for (let i = 1; i < lineas.length; i++) {
            let linea = lineas[i].trim();
            if (linea) {
                let campos = linea.split(';');
                if (campos.length >= 5) {
                    csvRows.push({
                        mesAnio: campos[0],
                        producto: campos[1],
                        inversion: parseFloat(campos[2]) || 0,
                        categoria: campos[3],
                        tienda: campos[4]
                    });
                }
            }
        }
        actualizarTablaUI();
    }

    async function agregarYGuardar() {
        let mesAnio = document.getElementById('mesAnio').value;
        let producto = document.getElementById('producto').value;
        let inversion = parseFloat(document.getElementById('inversion').value) || 0;
        let categoria = document.getElementById('categoria').value;
        let tienda = document.getElementById('tienda').value;

        if (!mesAnio || !producto) {
            alert('Por favor complete al menos el Mes/Año y el Producto.');
            return;
        }

        csvRows.push({ mesAnio, producto, inversion, categoria, tienda });

        let contenidoCSV = "MES/AÑO;PRODUCTO;INVERSION;CATEGORIA;TIENDA\n";
        csvRows.forEach(row => {
            contenidoCSV += `${row.mesAnio};${row.producto};${row.inversion};${row.categoria};${row.tienda}\n`;
        });

        try {
            let response = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
                method: 'PATCH',
                headers: new Headers({
                    'Authorization': 'Bearer ' + gapi.client.getToken().access_token,
                    'Content-Type': 'text/csv'
                }),
                body: contenidoCSV
            });

            if (response.ok) {
                document.getElementById('status-message').innerText = '¡Guardado con éxito en Google Drive!';
                actualizarTablaUI();
                // Limpiar inputs del formulario
                document.getElementById('producto').value = '';
                document.getElementById('inversion').value = '';
                document.getElementById('categoria').value = '';
                document.getElementById('tienda').value = '';
            } else {
                document.getElementById('status-message').innerText = 'Error al guardar el archivo.';
            }
        } catch (err) {
            document.getElementById('status-message').innerText = 'Error de conexión al guardar.';
        }
    }

    function actualizarTablaUI() {
        let tbody = document.querySelector('#csv-table tbody');
        tbody.innerHTML = '';
        let totalGastos = 0;

        csvRows.forEach(row => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${row.mesAnio}</td><td>${row.producto}</td><td>${row.inversion.toFixed(2)}</td><td>${row.categoria}</td><td>${row.tienda}</td>`;
            tbody.appendChild(tr);
            totalGastos += row.inversion;
        });

        let ingresoMensual = parseFloat(document.getElementById('ingresoMensual').value) || 0;
        let balanceRestante = ingresoMensual - totalGastos;

        let summaryDiv = document.getElementById('balance-summary');
        summaryDiv.innerHTML = `
            <strong>Ingreso Supuesto Mensual:</strong> ${ingresoMensual.toFixed(2)}<br>
            <strong>Total Gastos/Inversión:</strong> ${totalGastos.toFixed(2)}<br>
            <strong>Balance Restante:</strong> ${balanceRestante.toFixed(2)}
        `;
    }
</script>

</body>
</html>
